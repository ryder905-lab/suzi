<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#6c4cf5">
<title>수지 · 구경모 비서</title>
<style>
  :root{--main:#6c4cf5;--bg:#f4f2fb;--card:#fff;--text:#222;--sub:#777;--red:#e5484d;--green:#20a464}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--text);padding-bottom:80px}
  header{background:var(--main);color:#fff;padding:20px 18px 18px}
  header h1{font-size:22px}
  header p{font-size:14px;opacity:.9;margin-top:4px}
  main{padding:14px;max-width:560px;margin:0 auto}
  .card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .card h2{font-size:17px;margin-bottom:10px}
  label{display:block;font-size:13px;color:var(--sub);margin:8px 0 4px}
  input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px;background:#fff}
  .row{display:flex;gap:8px}.row>*{flex:1}
  button{border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:600;cursor:pointer}
  .btn{background:var(--main);color:#fff;width:100%;margin-top:12px}
  .btn2{background:#ece8fd;color:var(--main);width:100%;margin-top:8px}
  .item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f0f0f0}
  .item:last-child{border-bottom:0}
  .item .info{flex:1}
  .item .t{font-weight:600;font-size:16px}
  .item .s{font-size:13px;color:var(--sub);margin-top:2px}
  .del{background:none;color:#bbb;font-size:20px;padding:4px 8px}
  .done .t{text-decoration:line-through;color:#aaa}
  .empty{color:#aaa;font-size:14px;text-align:center;padding:14px 0}
  nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #e5e5e5;z-index:10}
  nav button{flex:1;background:none;border-radius:0;padding:10px 0 12px;font-size:12px;color:var(--sub);font-weight:500}
  nav button span{display:block;font-size:22px;margin-bottom:2px}
  nav button.on{color:var(--main);font-weight:700}
  .page{display:none}.page.on{display:block}
  .sum{display:flex;gap:8px;text-align:center}
  .sum div{flex:1;background:#f7f6fd;border-radius:12px;padding:10px 4px}
  .sum b{display:block;font-size:16px;margin-top:4px}
  .in{color:var(--green)}.out{color:var(--red)}
  .fortune{font-size:16px;line-height:1.7}
  .stars{font-size:22px;color:#f5a623;letter-spacing:2px}
  .banner{background:#fff4d6;color:#7a5a00;border-radius:12px;padding:12px;font-size:14px;margin-bottom:12px;line-height:1.5}
  .alarm-pop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:99;padding:20px}
  .alarm-pop.on{display:flex}
  .alarm-box{background:#fff;border-radius:20px;padding:28px 22px;text-align:center;width:100%;max-width:360px}
  .alarm-box .big{font-size:48px}
  .alarm-box h3{font-size:22px;margin:10px 0 6px}
  .alarm-box p{color:var(--sub);margin-bottom:16px}
  .tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;background:#ece8fd;color:var(--main);margin-left:6px;vertical-align:middle}
</style>
</head>
<body>

<header>
  <h1>👩‍💼 수지</h1>
  <p id="hello">구경모님, 안녕하세요!</p>
</header>

<main>
  <div class="banner" id="notiBanner" style="display:none">
    🔔 알람을 받으려면 알림을 허용해 주세요.
    <button class="btn" style="margin-top:8px;padding:10px" onclick="askNoti()">알림 허용하기</button>
  </div>

  <!-- 홈 -->
  <section class="page on" id="p-home">
    <div class="card">
      <h2>📅 오늘 할 일</h2>
      <div id="todayList"></div>
    </div>
    <div class="card">
      <h2>🍀 오늘의 운세</h2>
      <div id="homeFortune"></div>
    </div>
    <div class="card">
      <h2>💰 이번 달 돈</h2>
      <div id="homeMoney"></div>
    </div>
  </section>

  <!-- 일정 -->
  <section class="page" id="p-plan">
    <div class="card">
      <h2>➕ 일정·알람 추가</h2>
      <label>종류</label>
      <select id="pType">
        <option value="일정">📅 일반 일정</option>
        <option value="병원">🏥 병원</option>
        <option value="약">💊 약 먹기</option>
        <option value="차량">🚗 차량</option>
      </select>
      <label>내용</label>
      <input id="pTitle" placeholder="예: 치과 예약, 엔진오일 교체">
      <div class="row">
        <div><label>날짜</label><input type="date" id="pDate"></div>
        <div><label>시간</label><input type="time" id="pTime"></div>
      </div>
      <label>알람</label>
      <select id="pBefore">
        <option value="0">정각에 알림</option>
        <option value="10">10분 전</option>
        <option value="30">30분 전</option>
        <option value="60">1시간 전</option>
        <option value="1440">하루 전</option>
        <option value="-1">알람 없음</option>
      </select>
      <label>반복</label>
      <select id="pRepeat">
        <option value="">한 번만</option>
        <option value="day">매일</option>
        <option value="week">매주</option>
        <option value="month">매달</option>
      </select>
      <button class="btn" onclick="addPlan()">저장하기</button>
    </div>
    <div class="card">
      <h2>📋 다가오는 일정</h2>
      <div id="planList"></div>
    </div>
  </section>

  <!-- 차량 -->
  <section class="page" id="p-car">
    <div class="card">
      <h2>🚗 차량 기록 추가</h2>
      <label>항목</label>
      <select id="cType">
        <option>엔진오일</option><option>주유</option><option>타이어</option>
        <option>정기검사</option><option>보험</option><option>세차</option><option>기타 정비</option>
      </select>
      <div class="row">
        <div><label>날짜</label><input type="date" id="cDate"></div>
        <div><label>주행거리(km)</label><input type="number" id="cKm" inputmode="numeric" placeholder="예: 85000"></div>
      </div>
      <label>비용(원)</label>
      <input type="number" id="cCost" inputmode="numeric" placeholder="예: 70000">
      <label>메모</label>
      <input id="cMemo" placeholder="정비소 이름 등">
      <button class="btn" onclick="addCar()">저장하기</button>
      <p style="font-size:12px;color:#999;margin-top:8px">비용을 넣으면 '돈' 지출에도 자동으로 기록돼요.</p>
    </div>
    <div class="card">
      <h2>🔧 차량 기록</h2>
      <div id="carList"></div>
    </div>
  </section>

  <!-- 돈 -->
  <section class="page" id="p-money">
    <div class="card">
      <h2>💰 수입·지출 추가</h2>
      <div class="row">
        <button class="btn2" id="mIn" onclick="setMType('in')">➕ 수입</button>
        <button class="btn2" id="mOut" onclick="setMType('out')">➖ 지출</button>
      </div>
      <label>내용</label>
      <input id="mTitle" placeholder="예: 월급, 점심, 주유">
      <div class="row">
        <div><label>금액(원)</label><input type="number" id="mAmt" inputmode="numeric"></div>
        <div><label>날짜</label><input type="date" id="mDate"></div>
      </div>
      <button class="btn" onclick="addMoney()">저장하기</button>
    </div>
    <div class="card">
      <h2>📊 이번 달</h2>
      <div id="moneySum"></div>
    </div>
    <div class="card">
      <h2>📒 내역</h2>
      <div id="moneyList"></div>
    </div>
  </section>

  <!-- 운세 -->
  <section class="page" id="p-luck">
    <div class="card">
      <h2>🍀 오늘의 운세</h2>
      <div id="luckFull"></div>
    </div>
    <div class="card">
      <h2>⚙️ 설정</h2>
      <button class="btn2" onclick="testAlarm()">🔔 알람 테스트</button>
      <button class="btn2" onclick="backup()">💾 데이터 백업(복사)</button>
      <button class="btn2" onclick="restore()">📥 백업 붙여넣기</button>
      <p style="font-size:12px;color:#999;margin-top:10px;line-height:1.5">
        데이터는 이 휴대폰 브라우저 안에만 저장돼요. 브라우저 기록을 지우면 사라지니 가끔 백업해 두세요.
      </p>
    </div>
  </section>
</main>

<nav>
  <button class="on" data-p="home"><span>🏠</span>홈</button>
  <button data-p="plan"><span>📅</span>일정</button>
  <button data-p="car"><span>🚗</span>차량</button>
  <button data-p="money"><span>💰</span>돈</button>
  <button data-p="luck"><span>🍀</span>운세</button>
</nav>

<div class="alarm-pop" id="alarmPop">
  <div class="alarm-box">
    <div class="big" id="apIcon">⏰</div>
    <h3 id="apTitle">알람</h3>
    <p id="apSub"></p>
    <button class="btn" onclick="closeAlarm()">확인</button>
  </div>
</div>

<script>
// ---------- 저장소 ----------
function load(k, d){ try{ return JSON.parse(localStorage.getItem('suzi_'+k)) ?? d }catch(e){ return d } }
function save(k, v){ try{ localStorage.setItem('suzi_'+k, JSON.stringify(v)) }catch(e){} }
let plans = load('plans', []), cars = load('cars', []), money = load('money', []);
let mType = 'out';

// ---------- 도우미 ----------
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const won = n => Number(n||0).toLocaleString('ko-KR')+'원';
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const icons = {일정:'📅',병원:'🏥',약:'💊',차량:'🚗'};
const repeatName = {day:'매일',week:'매주',month:'매달'};
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }
function when(p){ return new Date(p.date+'T'+(p.time||'09:00')) }
function fmtWhen(p){
  const d = when(p), w = '일월화수목금토'[d.getDay()];
  return (d.getMonth()+1)+'/'+d.getDate()+'('+w+') '+(p.time||'');
}

// ---------- 탭 ----------
document.querySelectorAll('nav button').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); $('p-'+b.dataset.p).classList.add('on');
    window.scrollTo(0,0); render();
  };
});

// ---------- 일정 ----------
function addPlan(){
  const title = $('pTitle').value.trim();
  if(!title || !$('pDate').value){ alert('내용과 날짜를 넣어 주세요.'); return }
  plans.push({id:uid(), type:$('pType').value, title, date:$('pDate').value,
    time:$('pTime').value||'09:00', before:+$('pBefore').value, repeat:$('pRepeat').value, done:false, fired:false});
  save('plans', plans); $('pTitle').value=''; render();
  if(+$('pBefore').value >= 0) askNoti();
  alert('저장했어요! 👍');
}
function nextRepeat(p){
  const d = when(p);
  if(p.repeat==='day') d.setDate(d.getDate()+1);
  else if(p.repeat==='week') d.setDate(d.getDate()+7);
  else if(p.repeat==='month') d.setMonth(d.getMonth()+1);
  p.date = ymd(d); p.fired = false; p.done = false;
}
function toggleDone(id){
  const p = plans.find(x=>x.id===id); if(!p) return;
  if(p.repeat && !p.done){ nextRepeat(p) } else { p.done = !p.done }
  save('plans', plans); render();
}
function delPlan(id){ if(!confirm('삭제할까요?')) return; plans = plans.filter(x=>x.id!==id); save('plans', plans); render() }
function planItem(p){
  const alarm = p.before<0 ? '알람 없음' : (p.before===0?'정각 알림':p.before>=1440?'하루 전 알림':p.before>=60?'1시간 전 알림':p.before+'분 전 알림');
  return `<div class="item ${p.done?'done':''}">
    <input type="checkbox" style="width:22px;height:22px" ${p.done?'checked':''} onchange="toggleDone('${p.id}')">
    <div class="info"><div class="t">${icons[p.type]||'📅'} ${esc(p.title)}${p.repeat?'<span class="tag">'+repeatName[p.repeat]+'</span>':''}</div>
    <div class="s">${fmtWhen(p)} · 🔔 ${alarm}</div></div>
    <button class="del" onclick="delPlan('${p.id}')">✕</button></div>`;
}

// ---------- 차량 ----------
function addCar(){
  const type = $('cType').value, date = $('cDate').value || ymd(new Date()), cost = +$('cCost').value || 0;
  cars.unshift({id:uid(), type, date, km:$('cKm').value, cost, memo:$('cMemo').value.trim()});
  if(cost>0) money.unshift({id:uid(), type:'out', title:'🚗 '+type, amt:cost, date});
  save('cars', cars); save('money', money);
  $('cKm').value=''; $('cCost').value=''; $('cMemo').value='';
  render(); alert('저장했어요! 👍');
}
function delCar(id){ if(!confirm('삭제할까요?')) return; cars = cars.filter(x=>x.id!==id); save('cars', cars); render() }

// ---------- 돈 ----------
function setMType(t){
  mType = t;
  $('mIn').style.background = t==='in' ? 'var(--green)' : '#ece8fd'; $('mIn').style.color = t==='in' ? '#fff' : 'var(--main)';
  $('mOut').style.background = t==='out' ? 'var(--red)' : '#ece8fd'; $('mOut').style.color = t==='out' ? '#fff' : 'var(--main)';
}
function addMoney(){
  const title = $('mTitle').value.trim(), amt = +$('mAmt').value;
  if(!title || !amt){ alert('내용과 금액을 넣어 주세요.'); return }
  money.unshift({id:uid(), type:mType, title, amt, date:$('mDate').value||ymd(new Date())});
  save('money', money); $('mTitle').value=''; $('mAmt').value=''; render();
}
function delMoney(id){ if(!confirm('삭제할까요?')) return; money = money.filter(x=>x.id!==id); save('money', money); render() }
function monthSum(){
  const ym = ymd(new Date()).slice(0,7);
  let i=0,o=0; money.filter(m=>m.date.startsWith(ym)).forEach(m=> m.type==='in' ? i+=m.amt : o+=m.amt);
  return `<div class="sum"><div>수입<b class="in">${won(i)}</b></div><div>지출<b class="out">${won(o)}</b></div><div>남은 돈<b>${won(i-o)}</b></div></div>`;
}

// ---------- 운세 (1977-07-05 생 기준, 날짜마다 바뀜) ----------
function fortune(){
  const t = ymd(new Date()); let h = 19770705;
  for(const c of t) h = (h*31 + c.charCodeAt(0)) % 1000003;
  const pick = (arr, k) => arr[(h + k*7919) % arr.length];
  const money = ['작은 돈이 들어올 기운이 있어요. 놓친 환급이나 정산을 확인해 보세요.','충동구매를 조심하세요. 장바구니는 내일 다시 보기!','들어오는 돈보다 지키는 돈이 중요한 날이에요.','예상 못 한 지출이 생길 수 있으니 여유를 두세요.','작은 투자나 공부가 나중에 큰 도움이 되는 날이에요.','사람을 통해 좋은 정보가 들어와요. 대화를 많이 해 보세요.'];
  const work = ['미뤄 둔 일을 끝내기 좋은 날이에요.','회의나 보고에서 차분하게 말하면 인정받아요.','새 아이디어가 떠오르면 바로 메모해 두세요.','욕심내지 말고 한 가지에 집중하세요.','동료의 도움을 받으면 일이 훨씬 빨라져요.'];
  const health = ['물을 자주 드세요.','허리와 목 스트레칭을 챙기세요.','오늘은 일찍 주무시는 게 좋아요.','가벼운 산책이 기운을 올려 줘요.','과식을 조심하세요.'];
  const color = ['노란색','초록색','흰색','파란색','빨간색','보라색','금색'];
  const num = (h % 45) + 1, star = (h % 3) + 3;
  return {money:pick(money,1), work:pick(work,2), health:pick(health,3), color:pick(color,4), num, star};
}
function fortuneHTML(full){
  const f = fortune(), stars = '★'.repeat(f.star)+'☆'.repeat(5-f.star);
  let h = `<div class="stars">${stars}</div><div class="fortune">💰 ${f.money}</div>`;
  if(full) h += `<div class="fortune" style="margin-top:8px">💼 ${f.work}<br>💪 ${f.health}<br>🎨 행운의 색: ${f.color}<br>🔢 행운의 숫자: ${f.num}</div>`;
  return h;
}

// ---------- 화면 그리기 ----------
function render(){
  const now = new Date(), today = ymd(now), w = '일월화수목금토'[now.getDay()];
  $('hello').textContent = `구경모님, 오늘은 ${now.getMonth()+1}월 ${now.getDate()}일 ${w}요일이에요.`;
  const sorted = [...plans].sort((a,b)=>when(a)-when(b));
  const todays = sorted.filter(p=>p.date===today);
  $('todayList').innerHTML = todays.length ? todays.map(planItem).join('') : '<div class="empty">오늘은 일정이 없어요 😊</div>';
  const upcoming = sorted.filter(p=>p.date>=today || !p.done);
  $('planList').innerHTML = upcoming.length ? upcoming.map(planItem).join('') : '<div class="empty">아직 일정이 없어요</div>';
  $('carList').innerHTML = cars.length ? cars.map(c=>`<div class="item"><div class="info"><div class="t">🔧 ${esc(c.type)}</div>
    <div class="s">${c.date}${c.km?' · '+Number(c.km).toLocaleString()+'km':''}${c.cost?' · '+won(c.cost):''}${c.memo?' · '+esc(c.memo):''}</div></div>
    <button class="del" onclick="delCar('${c.id}')">✕</button></div>`).join('') : '<div class="empty">아직 기록이 없어요</div>';
  $('moneySum').innerHTML = monthSum(); $('homeMoney').innerHTML = monthSum();
  $('moneyList').innerHTML = money.length ? money.slice(0,50).map(m=>`<div class="item"><div class="info"><div class="t">${esc(m.title)}</div>
    <div class="s">${m.date}</div></div><b class="${m.type}">${m.type==='in'?'+':'-'}${won(m.amt)}</b>
    <button class="del" onclick="delMoney('${m.id}')">✕</button></div>`).join('') : '<div class="empty">아직 내역이 없어요</div>';
  $('homeFortune').innerHTML = fortuneHTML(false); $('luckFull').innerHTML = fortuneHTML(true);
  $('notiBanner').style.display = ('Notification' in window && Notification.permission==='default') ? 'block' : 'none';
}

// ---------- 알람 ----------
function askNoti(){ if('Notification' in window && Notification.permission==='default') Notification.requestPermission().then(render) }
let audioCtx;
function beep(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<3;i++){
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      const t = audioCtx.currentTime + i*0.5;
      g.gain.setValueAtTime(0.4,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.4);
      o.start(t); o.stop(t+0.4);
    }
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([400,200,400,200,400]);
}
function ring(p){
  beep();
  $('apIcon').textContent = icons[p.type]||'⏰';
  $('apTitle').textContent = p.title;
  $('apSub').textContent = fmtWhen(p);
  $('alarmPop').classList.add('on');
  if('Notification' in window && Notification.permission==='granted'){
    try{ new Notification('수지 알람 ⏰', {body:p.title+' · '+fmtWhen(p), requireInteraction:true}) }catch(e){}
  }
}
function closeAlarm(){ $('alarmPop').classList.remove('on') }
function checkAlarms(){
  const now = Date.now(); let changed = false;
  plans.forEach(p=>{
    if(p.before<0 || p.fired || p.done) return;
    const at = when(p).getTime() - p.before*60000;
    if(now >= at && now - at < 6*3600000){ p.fired = true; changed = true; ring(p) }
    else if(now - at >= 6*3600000){ p.fired = true; changed = true }
  });
  if(changed){ save('plans', plans); render() }
}
function testAlarm(){ askNoti(); ring({type:'일정', title:'알람 테스트예요!', date:ymd(new Date()), time:new Date().toTimeString().slice(0,5)}) }

// ---------- 백업 ----------
function backup(){
  const data = JSON.stringify({plans,cars,money});
  if(navigator.clipboard) navigator.clipboard.writeText(data).then(()=>alert('복사했어요! 카톡 나에게 보내기 등에 붙여넣어 두세요.'),()=>prompt('아래 내용을 복사해 두세요',data));
  else prompt('아래 내용을 복사해 두세요', data);
}
function restore(){
  const t = prompt('백업해 둔 내용을 붙여넣어 주세요'); if(!t) return;
  try{ const d = JSON.parse(t); plans=d.plans||[]; cars=d.cars||[]; money=d.money||[];
    save('plans',plans); save('cars',cars); save('money',money); render(); alert('복원했어요!') }
  catch(e){ alert('내용이 올바르지 않아요.') }
}

// ---------- 시작 ----------
const td = ymd(new Date());
$('pDate').value = td; $('cDate').value = td; $('mDate').value = td;
setMType('out'); render(); checkAlarms();
setInterval(checkAlarms, 20000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ render(); checkAlarms() } });
</script>
